# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
# GEMINI_API_KEY y ACCESS_KEY se piden al crear el servicio (sync: false): sus valores no se guardan
# en este archivo. GEMINI_API_KEY nunca sale del servidor. Cada push a main vuelve a desplegar.
services:
  - type: web
    name: reto03-ordenes-compra
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # gemini (no auto): si falta la clave, el servicio falla al arrancar en vez de quedar en modo simulado.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING
        value: low
      - key: GEMINI_API_KEY
        sync: false
      # Clave del link (mínimo 16 caracteres): se carga en Render y se publica en el README, como pide
      # el PRD. Es exclusiva de la demo, protege la cuota del modelo y se rota tras la evaluación.
      - key: ACCESS_KEY
        sync: false
      # Falla cerrado: si ACCESS_KEY quedó vacía, la API se bloquea (503) en vez de quedar abierta.
      - key: EXIGIR_ACCESS_KEY
        value: "1"
      # Render atiende detrás de dos proxies (Cloudflare + el suyo), que agregan al final de
      # X-Forwarded-For: el límite por IP cuenta 2 saltos desde la derecha (no se puede falsificar).
      - key: TRUST_PROXY
        value: "2"
      - key: MAX_TOKENS_DIA
        value: "2000000"
      - key: MAX_MENSAJES_POR_MINUTO
        value: "12"
